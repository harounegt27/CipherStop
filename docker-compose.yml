version: "3.9"

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cipherstop_dev
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8888:8888"
    command: bash
    stdin_open: true
    tty: true
    depends_on:
      - mlflow

  mlflow:
    image: python:3.11.9-slim
    container_name: cipherstop_mlflow
    environment:
      - MLFLOW_HOST=0.0.0.0
    command: >
      bash -c "pip install mlflow==2.16.2 &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri sqlite:///mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts
               --workers 1"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow