
services:
  backend:
    build:
      context: .
      dockerfile: docker/DockerFile
    container_name: cipherstop_backend
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ALERT_THRESHOLD: "0.85"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      ALERT_EMAIL: ""
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      mlflow:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: python:3.11.9-slim
    container_name: cipherstop_mlflow
    environment:
      - MLFLOW_HOST=0.0.0.0
    command: >
      bash -c "pip install mlflow==2.16.2 &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri sqlite:////mlflow/mlflow.db
               --artifacts-destination /mlflow/artifacts
               --serve-artifacts
               --workers 1"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5