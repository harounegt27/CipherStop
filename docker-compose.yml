version: "3.9"

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cipherstop_dev
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    ports:
      - "8888:8888"   # Jupyter if needed
    command: bash
    stdin_open: true
    tty: true